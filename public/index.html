<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Converter</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #e2e8f0;
      --card-bg: #ffffff;
      --border-color: #0f172a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #059669;
      --danger: #dc2626;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(90deg, #cbd5e1 1px, transparent 1px),
        linear-gradient(0deg, #cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
    }

    .container {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      box-shadow: 6px 6px 0px 0px var(--border-color);
      border-radius: 6px;
      padding: 28px;
      width: 100%;
      /* Card form diperkecil sedikit agar lebih proporsional */
      max-width: 680px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
        box-shadow: 4px 4px 0px 0px var(--border-color);
        max-width: 100%;
      }
    }

    .header {
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header h1 {
      font-family: 'Press Start 2P', monospace;
      color: var(--border-color);
      font-size: 13px;
      line-height: 1.4;
    }

    .badge-status {
      font-family: 'Share Tech Mono', monospace;
      background: #dbeafe;
      color: #1e40af;
      border: 2px solid var(--border-color);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: 2px 2px 0px 0px var(--border-color);
    }

    .upload-area {
      border: 2px dashed var(--border-color);
      border-radius: 4px;
      padding: 26px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--input-bg);
      margin-bottom: 18px;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .upload-area .icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .upload-area p {
      color: var(--text-muted);
      font-size: 13px;
      margin: 4px 0;
    }

    .upload-area p.main-text {
      color: var(--border-color);
      font-weight: 700;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    .panel-card {
      background: var(--input-bg);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }

    .panel-card.show {
      display: block;
    }

    .file-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .file-name {
      font-weight: 700;
      color: var(--primary);
      word-break: break-all;
      font-size: 14px;
      font-family: 'Share Tech Mono', monospace;
    }

    .file-size {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Share Tech Mono', monospace;
    }

    .format-selector label {
      display: block;
      color: var(--border-color);
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'Share Tech Mono', monospace;
    }

    .format-selector select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      background: #ffffff;
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      cursor: pointer;
      outline: none;
      font-weight: bold;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
    }

    .format-selector select:focus {
      border-color: var(--primary);
      box-shadow: 2px 2px 0px 0px var(--border-color);
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .btn-group {
        grid-template-columns: 1fr;
      }
    }

    button {
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 3px 3px 0px 0px var(--border-color);
      text-transform: uppercase;
    }

    button:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px 0px var(--border-color);
    }

    .btn-select {
      background: #e2e8f0;
      color: var(--border-color);
    }
    .btn-select:hover { background: #cbd5e1; }

    .btn-convert {
      background: var(--primary);
      color: #fff;
      grid-column: span 2;
    }
    @media (max-width: 600px) {
      .btn-convert { grid-column: span 1; }
    }
    .btn-convert:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-convert:disabled {
      background: #94a3b8;
      border-color: #64748b;
      color: #e2e8f0;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-download {
      background: var(--success);
      color: #fff;
      grid-column: span 2;
    }
    @media (max-width: 600px) {
      .btn-download { grid-column: span 1; }
    }
    .btn-download:hover { background: #047857; }

    .btn-reset {
      background: var(--danger);
      color: #fff;
    }
    .btn-reset:hover { background: #b91c1c; }

    .status {
      text-align: center;
      margin-top: 16px;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      display: none;
      font-size: 13px;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      box-shadow: 2px 2px 0px 0px var(--border-color);
    }

    .status.show { display: block; }
    .status.loading { background: #e0f2fe; color: #0369a1; border-color: #0369a1; }
    .status.success { background: #d1fae5; color: #065f46; border-color: #059669; }
    .status.error { background: #fee2e2; color: #991b1b; border-color: #dc2626; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(3, 105, 161, 0.3);
      border-top: 2px solid #0369a1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-footer {
      margin-top: 20px;
      border-top: 2px solid #cbd5e1;
      padding-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>DocConverter</h1>
    </div>

    <!-- Area Unggah File -->
    <div class="upload-area" id="uploadArea">
      <div class="icon">📁</div>
      <p class="main-text">Klik untuk memilih file atau seret ke sini</p>
      <p>Mendukung Dokumen Word, Excel, PowerPoint, PDF, & Teks (Maks. 100MB)</p>
    </div>

    <input type="file" id="fileInput">

    <!-- Panel Informasi File Terpilih -->
    <div class="panel-card" id="fileInfo">
      <div class="file-meta">
        <div>
          <span style="font-size: 11px; color: var(--text-muted); display: block; font-family: 'Share Tech Mono';">FILE TERDETEKSI:</span>
          <span class="file-name" id="fileName">document.docx</span>
        </div>
        <span class="file-size" id="fileSize">0.00 MB</span>
      </div>
    </div>

    <!-- Panel Pemilihan Format Target -->
    <div class="panel-card format-selector" id="formatSelector">
      <label for="outputFormat">> Pilih Format Konversi Target:</label>
      <select id="outputFormat"></select>
    </div>

    <!-- Status Proses -->
    <div class="status" id="status"></div>

    <!-- Tombol Aksi Utama -->
    <div class="btn-group">
      <button class="btn-select" onclick="triggerFileInput()">📂 Ganti File</button>
      <button class="btn-reset" onclick="resetForm()">↺ Reset</button>
      <button class="btn-convert" id="convertBtn" onclick="convertFile()" disabled>⚡ Mulai Konversi Dokumen</button>
      <button class="btn-download" id="downloadBtn" onclick="downloadFile()" style="display:none;">📥 Unduh Hasil Konversi</button>
    </div>

    <div class="info-footer">
      Format output otomatis disesuaikan dengan kapabilitas engine LibreOffice sistem.
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const status = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const formatSelector = document.getElementById('formatSelector');
    const outputFormatSelect = document.getElementById('outputFormat');

    let selectedFile = null;
    let fileData = null;
    let tempFile = null;
    let outputFileName = null;

    uploadArea.addEventListener('click', triggerFileInput);

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function triggerFileInput() {
      fileInput.click();
    }

    async function handleFiles(files) {
      if (files.length === 0) return;

      selectedFile = files[0];
      
      if (selectedFile.size > 100 * 1024 * 1024) {
        showStatus('Gagal: Ukuran file melebihi batas maksimal 100MB.', 'error');
        selectedFile = null;
        return;
      }

      const ext = '.' + selectedFile.name.split('.').pop().toLowerCase();
      const supportedExtensions = ['.docx', '.doc', '.odt', '.txt', '.rtf', '.xlsx', '.xls', '.ods', '.csv', '.pptx', '.ppt', '.odp', '.pdf', '.html', '.htm'];
      
      if (!supportedExtensions.includes(ext)) {
        showStatus('Gagal: Format ekstensi file tidak didukung oleh sistem.', 'error');
        selectedFile = null;
        return;
      }

      fileName.textContent = selectedFile.name;
      fileSize.textContent = `${(selectedFile.size / 1024 / 1024).toFixed(2)} MB`;
      fileInfo.classList.add('show');
      convertBtn.disabled = false;
      downloadBtn.style.display = 'none';
      status.classList.remove('show');

      await loadFormats(ext);
    }

    async function loadFormats(fileExt) {
      try {
        const response = await fetch(`/formats?ext=${fileExt}`);
        const data = await response.json();

        if (data.success && data.formats) {
          outputFormatSelect.innerHTML = '';
          data.formats.forEach(format => {
            const option = document.createElement('option');
            option.value = format;
            option.textContent = `[ ${format.toUpperCase()} ]`;
            outputFormatSelect.appendChild(option);
          });

          formatSelector.classList.add('show');
        }
      } catch (err) {
        console.error('Gagal memuat format:', err);
        formatSelector.classList.remove('show');
      }
    }

    async function convertFile() {
      if (!selectedFile) {
        showStatus('Pilih file dokumen terlebih dahulu.', 'error');
        return;
      }

      const outputFormat = outputFormatSelect.value;
      if (!outputFormat) {
        showStatus('Pilih format target output.', 'error');
        return;
      }

      convertBtn.disabled = true;
      downloadBtn.style.display = 'none';
      showStatus('<span class="spinner"></span>Sedang memproses dokumen, mohon tunggu...', 'loading');

      try {
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('format', outputFormat);

        const response = await fetch('/convert', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Proses konversi gagal');
        }

        fileData = data.fileData;
        tempFile = data.tempFile;
        outputFileName = data.fileName;

        convertBtn.style.display = 'none';
        downloadBtn.style.display = 'flex';
        showStatus('✓ Konversi berhasil! File Anda siap diunduh.', 'success');

      } catch (error) {
        showStatus('Error: ' + error.message, 'error');
        convertBtn.disabled = false;
      }
    }

    function downloadFile() {
      if (!fileData) return;

      const binaryString = atob(fileData);
      const bytes = new Uint8Array(binaryString.length);
      
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      
      const blob = new Blob([bytes]);
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = outputFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      fetch('/cleanup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tempFile: tempFile })
      }).catch(err => console.error('Cleanup error:', err));

      setTimeout(() => {
        resetForm();
      }, 500);
    }

    function resetForm() {
      selectedFile = null;
      fileData = null;
      tempFile = null;
      outputFileName = null;
      fileInput.value = '';
      fileInfo.classList.remove('show');
      formatSelector.classList.remove('show');
      downloadBtn.style.display = 'none';
      convertBtn.style.display = 'flex';
      status.classList.remove('show');
      convertBtn.disabled = true;
    }

    function showStatus(message, type) {
      status.innerHTML = message;
      status.className = `status show ${type}`;
    }
  </script>
</body>
</html>
