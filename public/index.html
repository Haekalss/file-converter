<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convert Station</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Convert Station</h1>
    </div>

    <!-- Upload Area -->
    <div class="upload-area" id="uploadArea">
      <p class="main-text">Click to browse or drag and drop your file here</p>
      <p>Supports Word, Excel, PowerPoint, PDF, & Text documents (Max. 100MB)</p>
    </div>

    <input type="file" id="fileInput" hidden>

    <!-- Selected File Info Panel -->
    <div class="panel-card" id="fileInfo">
      <div class="file-meta">
        <div>
          <span style="font-size: 11px; color: var(--text-muted); display: block; font-family: 'Share Tech Mono';">DETECTED FILE:</span>
          <span class="file-name" id="fileName">document.docx</span>
        </div>
        <span class="file-size" id="fileSize">0.00 MB</span>
      </div>
    </div>

    <!-- Target Format Selector Panel -->
    <div class="panel-card format-selector" id="formatSelector">
      <label for="outputFormat">> Select Target Format:</label>
      <select id="outputFormat"></select>
    </div>

    <!-- Process Status -->
    <div class="status" id="status"></div>

    <!-- Main Action Buttons -->
    <div class="btn-group">
      <button class="btn-select" onclick="triggerFileInput()">Change File</button>
      <button class="btn-reset" onclick="resetForm()">Reset</button>
      <button class="btn-convert" id="convertBtn" onclick="convertFile()" disabled>Start Conversion</button>
      <button class="btn-download" id="downloadBtn" onclick="downloadFile()" style="display:none;">Download Converted File</button>
    </div>

    <div class="info-footer">
      Output formats are automatically adjusted based on system engine capabilities.
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
